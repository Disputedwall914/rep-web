<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --sheet-bg: #ffffff;
      --sheet-card: #f2f2f7;
      --sheet-border: #e5e5ea;
      --text-dark: #000000;
      --text-light: #ffffff;
      --text-muted: #8e8e93;
      --accent-green: #30d158;
      --accent-orange: #ff9500;
      --accent-red: #ff453a;
      --accent-blue: #0a84ff;
      --btn-dark: #1c1c1e;
      --checkbox-checked: #3a3a3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      background-color: var(--bg);
      color: var(--text-light);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* MINIMAL CURSIVE LANDING PAGE (Default when no data or after finishing) */
    .blank-landing-page {
      position: fixed;
      inset: 0;
      background: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .landing-content-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .cursive-brand-title {
      font-family: 'Dancing Script', 'Snell Roundhand', 'Apple Chancery', 'Brush Script MT', cursive;
      font-size: 88px;
      font-weight: 700;
      font-style: italic;
      color: #ffffff;
      letter-spacing: 2px;
      text-shadow: 0 4px 36px rgba(255, 255, 255, 0.25);
      animation: floatIn 0.8s cubic-bezier(0.18, 0.89, 0.32, 1);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Apple-Style TestFlight Button (Clean, solid, no gradients) */
    .testflight-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #ffffff;
      color: #000000;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 30px;
      margin-top: 32px;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 24px rgba(255, 255, 255, 0.2);
    }

    .testflight-btn:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    /* Top Navigation Bar */
    .top-nav {
      height: 52px;
      padding: 6px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
      margin-top: env(safe-area-inset-top, 0px);
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--btn-dark);
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
      height: 38px;
      padding: 0 14px;
      gap: 6px;
      text-decoration: none;
    }

    .download-app-btn {
      color: var(--text-light);
      background: #1c1c1e;
      border-color: rgba(255, 255, 255, 0.15);
    }

    .download-app-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .top-counter {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.2px;
      font-variant-numeric: tabular-nums;
      color: var(--text-light);
    }

    .finish-btn {
      background: #1c1c1e;
      color: var(--text-light);
    }

    .watch-icon {
      color: var(--accent-green);
      display: flex;
      align-items: center;
    }

    .watch-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Top Timer Area */
    .timer-area {
      position: absolute;
      top: calc(68px + env(safe-area-inset-top, 0px));
      left: 0;
      right: 0;
      height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 5;
      padding-top: 8px;
    }

    .big-timer {
      font-size: 74px;
      font-weight: 800;
      letter-spacing: -2px;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      margin-bottom: 6px;
      color: #ffffff;
      text-shadow: 0 4px 24px rgba(255, 255, 255, 0.2);
    }

    .total-elapsed {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
      margin-bottom: 16px;
    }

    .timer-controls {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .timer-adjust-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #1c1c1e;
      color: var(--text-light);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      position: relative;
    }

    .timer-adjust-btn svg {
      position: absolute;
      width: 36px;
      height: 36px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .skip-btn {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-light);
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
    }

    /* Draggable White Sheet */
    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--sheet-bg);
      color: var(--text-dark);
      border-top-left-radius: 34px;
      border-top-right-radius: 34px;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.6);
      z-index: 20;
      display: flex;
      flex-direction: column;
      transition: top 0.32s cubic-bezier(0.18, 0.89, 0.32, 1);
      will-change: top;
    }

    /* Snap positions: collapsed, half, expanded */
    .sheet.collapsed { top: calc(100vh - 170px); }
    .sheet.half { top: 315px; }
    .sheet.expanded { top: calc(52px + env(safe-area-inset-top, 0px)); }

    .sheet-handle-bar {
      width: 100%;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
      padding-top: 4px;
    }

    .sheet-handle {
      width: 44px;
      height: 5px;
      background: #d1d1d6;
      border-radius: 3px;
    }

    .sheet-content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px 18px 80px;
    }

    /* Exercise Section in Sheet */
    .exercise-block {
      margin-bottom: 28px;
    }

    .exercise-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .exercise-name-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-red);
      display: inline-block;
    }

    .exercise-title {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text-dark);
    }

    .exercise-menu-btn {
      background: #f2f2f7;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 15px;
      font-weight: bold;
    }

    .exercise-meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .rest-target-badge {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* Sets Container */
    .sets-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 16px;
      background: transparent;
      transition: background 0.15s ease;
    }

    .set-row.active {
      background: var(--sheet-card);
    }

    .set-inputs-left {
      display: flex;
      align-items: baseline;
      gap: 20px;
      flex: 1;
    }

    .input-val-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .input-number {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
      color: var(--text-dark);
      font-variant-numeric: tabular-nums;
      border: none;
      background: none;
      width: 46px;
      outline: none;
    }

    .input-label {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .set-actions-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .flame-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 149, 0, 0.12);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      color: var(--accent-orange);
    }

    .checkbox-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      border: 2px solid #d1d1d6;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.3, 1.2, 0.4, 1);
    }

    .checkbox-btn.checked {
      background: var(--checkbox-checked);
      border-color: var(--checkbox-checked);
      transform: scale(1.05);
    }

    .checkbox-btn svg {
      display: none;
      width: 18px;
      height: 18px;
      stroke: white;
      stroke-width: 3;
      fill: none;
    }

    .checkbox-btn.checked svg {
      display: block;
    }

    .add-set-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      background: var(--sheet-card);
      color: var(--text-dark);
      border: none;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }

    /* CONFIRMATION DIALOG */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .confirm-overlay.open {
      display: flex;
    }

    .confirm-card {
      background: #1c1c1e;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      width: 100%;
      max-width: 320px;
      padding: 24px 20px;
      text-align: center;
      color: white;
      animation: popIn 0.25s cubic-bezier(0.18, 0.89, 0.32, 1);
    }

    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .confirm-title {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .confirm-msg {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: 22px;
    }

    .confirm-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-finish-confirm {
      width: 100%;
      height: 48px;
      border-radius: 24px;
      background: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-cancel-confirm {
      width: 100%;
      height: 44px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
    }

    /* FULLSCREEN WORKOUT COMPLETION SCREEN */
    .completion-screen {
      position: fixed;
      inset: 0;
      background: #ffffff;
      color: #000000;
      z-index: 50;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: env(safe-area-inset-top, 16px) 20px 30px;
    }

    .completion-screen.open {
      display: flex;
    }

    .completion-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .comp-action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.05);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #000;
      cursor: pointer;
    }

    .completion-laurel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 800;
      color: #000000;
      margin-bottom: 12px;
    }

    .completion-sentence {
      font-size: 32px;
      font-weight: 600;
      line-height: 1.25;
      text-align: center;
      color: rgba(0, 0, 0, 0.28);
      margin-bottom: 20px;
      padding: 0 4px;
      letter-spacing: -0.5px;
    }

    .completion-sentence .highlight {
      color: #000000;
      font-weight: 800;
    }

    .completion-pills-row {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .comp-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 20px;
      font-size: 15px;
      font-weight: 700;
      color: #000000;
    }

    .comp-pill.sets-pill span:first-child {
      color: var(--accent-red);
    }

    /* Muscle Anatomy Heatmap (Official Wger SVGs) */
    .anatomy-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin: 10px 0 24px;
      min-height: 250px;
      position: relative;
    }

    .anatomy-figure {
      position: relative;
      width: 140px;
      height: 250px;
    }

    .anatomy-figure img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .anatomy-base {
      opacity: 0.32;
      filter: grayscale(1) contrast(1.1) brightness(0.75);
    }

    .anatomy-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .anatomy-layer.primary {
      filter: brightness(0) saturate(100%) invert(58%) sepia(85%) saturate(2200%) hue-rotate(360deg) brightness(102%) contrast(105%);
      opacity: 0.95;
    }

    .anatomy-layer.secondary {
      filter: brightness(0) saturate(100%) invert(45%) sepia(98%) saturate(4532%) hue-rotate(201deg) brightness(104%) contrast(101%);
      opacity: 0.88;
    }

    .completion-bottom-btn {
      width: 100%;
      height: 56px;
      border-radius: 28px;
      background: #000000;
      color: #ffffff;
      font-size: 18px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: auto;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: #2c2c2e;
      color: white;
      padding: 12px 22px;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      z-index: 200;
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- MINIMAL CURSIVE LANDING PAGE (Shown when no workout data or after finishing) -->
  <div class="blank-landing-page" id="blankLandingPage" style="display: none;">
    <div class="landing-content-wrap">
      <div class="cursive-brand-title">Rep</div>
      <a href="https://testflight.apple.com/join/juxSXXRQ" target="_blank" rel="noopener noreferrer" class="testflight-btn">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.66-1.06 1.73-.93 2.76 1.01.08 2.02-.51 2.64-1.26z"/>
        </svg>
        <span>Download on TestFlight</span>
      </a>
    </div>
  </div>

  <!-- Top Navigation Bar -->
  <div class="top-nav" id="topNav">
    <a href="https://testflight.apple.com/join/juxSXXRQ" target="_blank" rel="noopener noreferrer" class="nav-btn download-app-btn" id="downloadAppBtn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
        <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.37c.62-.75 1.04-1.8 0.92-2.85-.9.04-1.99.6-2.63 1.35-.57.66-1.06 1.73-.93 2.76 1.01.08 2.02-.51 2.64-1.26z"/>
      </svg>
      <span>Get Rep</span>
    </a>
    <div class="top-counter" id="topCounter">0 / 0</div>
    <button class="nav-btn finish-btn" onclick="promptFinishWorkout()">
      <span class="watch-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
      </span>
      <span>Finish</span>
    </button>
  </div>

  <!-- Top Big Rest Timer Area -->
  <div class="timer-area" id="timerArea">
    <div class="big-timer" id="restTimerDisplay">0:00</div>
    <div class="total-elapsed" id="totalElapsedDisplay">0:00</div>
    <div class="timer-controls">
      <button class="timer-adjust-btn" onclick="adjustRestTimer(-15)">
        <svg viewBox="0 0 36 36"><path d="M18 4 A 14 14 0 1 0 32 18" stroke-dasharray="80" stroke-linecap="round"/></svg>
        <span>-15</span>
      </button>
      <button class="skip-btn" onclick="skipRestTimer()">Skip</button>
      <button class="timer-adjust-btn" onclick="adjustRestTimer(15)">
        <svg viewBox="0 0 36 36" style="transform: scaleX(-1)"><path d="M18 4 A 14 14 0 1 0 32 18" stroke-dasharray="80" stroke-linecap="round"/></svg>
        <span>+15</span>
      </button>
    </div>
  </div>

  <!-- Draggable Bottom Sheet -->
  <div class="sheet half" id="bottomSheet">
    <div class="sheet-handle-bar" id="dragHandle">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-content" id="sheetContent">
      <!-- Exercises dynamically injected -->
    </div>
  </div>

  <!-- CONFIRMATION DIALOG -->
  <div class="confirm-overlay" id="confirmDialog">
    <div class="confirm-card">
      <h3 class="confirm-title">Finish Workout?</h3>
      <p class="confirm-msg">This will complete your session and generate your workout breakdown.</p>
      <div class="confirm-actions">
        <button class="btn-finish-confirm" onclick="confirmFinishWorkout()">Finish Workout</button>
        <button class="btn-cancel-confirm" onclick="closeConfirmDialog()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- FULLSCREEN WORKOUT COMPLETION SCREEN -->
  <div class="completion-screen" id="completionScreen">
    <div class="completion-top-bar">
      <button class="comp-action-btn" onclick="exportWorkoutOnly()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
      <button class="comp-action-btn" onclick="redirectToBlankPage()">✕</button>
    </div>

    <div class="completion-laurel">
      <span>🌿</span>
      <span>Congratulations</span>
      <span>🌿</span>
    </div>

    <div class="completion-sentence" id="completionSentence">
      You have completed<br>
      <span class="highlight" id="compSetsHighlight">0 sets</span> and lifted<br>
      <span class="highlight" id="compVolumeHighlight">0 kg</span> in <span class="highlight" id="compTimeHighlight">0 min</span>
    </div>

    <div class="completion-pills-row">
      <div class="comp-pill sets-pill">
        <span>🏋️</span>
        <span id="compPillSets">0 sets</span>
      </div>
      <div class="comp-pill">
        <span>🏆</span>
        <span id="compPillRecords">Workout Completed</span>
      </div>
    </div>

    <!-- Body Anatomy Heatmap (Official Wger SVGs) -->
    <div class="anatomy-container" id="anatomyContainer">
      <div class="anatomy-figure">
        <img class="anatomy-base" src="https://raw.githubusercontent.com/wger-project/wger/master/wger/core/static/images/muscles/muscular_system_front.svg" alt="Front Anatomy">
        <div id="frontMuscleLayers"></div>
      </div>
      <div class="anatomy-figure">
        <img class="anatomy-base" src="https://raw.githubusercontent.com/wger-project/wger/master/wger/core/static/images/muscles/muscular_system_back.svg" alt="Back Anatomy">
        <div id="backMuscleLayers"></div>
      </div>
    </div>

    <button class="completion-bottom-btn" onclick="redirectToBlankPage()">
      Continue
    </button>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast">
    <span id="toastMsg">Exported!</span>
  </div>

  <script>
    // State
    let splitData = null;
    let workoutStartTime = Date.now();
    let workoutTimerInterval = null;
    let restTimeRemaining = 0;
    let restTimerInterval = null;
    let totalCompletedSets = 0;
    let totalPlannedSets = 0;

    // Sheet touch physics
    const sheet = document.getElementById('bottomSheet');
    const dragHandle = document.getElementById('dragHandle');
    let startY = 0;
    let currentY = 0;
    let initialTop = 0;
    let isDragging = false;
    let sheetState = 'half';

    function initSplit() {
      let rawData = null;
      if (window.location.hash.includes('data=')) {
        rawData = window.location.hash.split('data=')[1];
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        rawData = urlParams.get('data');
      }

      // If no workout data is provided in the URL, display the blank landing page with cursive 'Rep' & TestFlight button
      if (!rawData) {
        showBlankLandingPage();
        return;
      }

      try {
        let base64 = rawData.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) base64 += '=';
        const jsonStr = decodeURIComponent(escape(atob(base64)));
        const rawObj = JSON.parse(jsonStr);
        
        splitData = {
          name: rawObj.n || rawObj.name || 'Workout',
          weightUnit: rawObj.u || rawObj.weightUnit || 'kg',
          exercises: (rawObj.e || rawObj.exercises || []).map(ex => ({
            name: ex.n || ex.name || 'Exercise',
            equipment: ex.e || ex.equipment || '',
            restSeconds: ex.r || ex.restSeconds || 120,
            sets: (ex.t || ex.sets || []).map(s => ({
              reps: s.r !== undefined ? s.r : s.reps || 10,
              weight: s.w !== undefined ? s.w : s.weight || 0,
              kind: s.k || s.kind || 'working',
              completed: false
            }))
          }))
        };
        
        renderExercises();
        startWorkoutClock();
      } catch (e) {
        console.error('Invalid split payload:', e);
        showBlankLandingPage();
      }
    }

    function showBlankLandingPage() {
      document.getElementById('blankLandingPage').style.display = 'flex';
      document.getElementById('topNav').style.display = 'none';
      document.getElementById('timerArea').style.display = 'none';
      document.getElementById('bottomSheet').style.display = 'none';
      document.getElementById('completionScreen').classList.remove('open');
    }

    function renderExercises() {
      const content = document.getElementById('sheetContent');
      let html = '';
      totalPlannedSets = 0;
      totalCompletedSets = 0;

      splitData.exercises.forEach((ex, exIdx) => {
        totalPlannedSets += ex.sets.length;
        const restMin = Math.floor(ex.restSeconds / 60);

        let setsHtml = '';
        ex.sets.forEach((set, sIdx) => {
          if (set.completed) totalCompletedSets++;
          const isWarmup = set.kind === 'warmup';
          const isDone = set.completed;

          setsHtml += `
            <div class="set-row ${isDone ? '' : 'active'}" id="set-row-${exIdx}-${sIdx}">
              <div class="set-inputs-left">
                <div class="input-val-group">
                  <input type="number" class="input-number" value="${set.weight}" onchange="updateSetWeight(${exIdx}, ${sIdx}, this.value)" inputmode="decimal">
                  <span class="input-label">${splitData.weightUnit}</span>
                </div>
                <div class="input-val-group">
                  <input type="number" class="input-number" value="${set.reps}" onchange="updateSetReps(${exIdx}, ${sIdx}, this.value)" inputmode="numeric">
                  <span class="input-label">reps</span>
                </div>
              </div>
              <div class="set-actions-right">
                ${isWarmup ? `<button class="flame-btn">🔥</button>` : ''}
                <button class="checkbox-btn ${isDone ? 'checked' : ''}" onclick="toggleSetComplete(${exIdx}, ${sIdx})">
                  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </button>
              </div>
            </div>
          `;
        });

        html += `
          <div class="exercise-block">
            <div class="exercise-title-row">
              <div class="exercise-name-wrap">
                <span class="status-dot"></span>
                <h3 class="exercise-title">${ex.name}</h3>
              </div>
              <button class="exercise-menu-btn">•••</button>
            </div>
            <div class="exercise-meta-row">
              <span>${ex.equipment || 'Exercise'}</span>
              <span class="rest-target-badge">⏱ ${restMin}m</span>
            </div>
            <div class="sets-container" id="sets-list-${exIdx}">
              ${setsHtml}
            </div>
            <button class="add-set-btn" onclick="addSet(${exIdx})">
              <span>+ Add Set</span>
            </button>
          </div>
        `;
      });

      content.innerHTML = html;
      updateTopCounter();
    }

    function toggleSetComplete(exIdx, sIdx) {
      const set = splitData.exercises[exIdx].sets[sIdx];
      set.completed = !set.completed;

      if (navigator.vibrate) navigator.vibrate(40);

      if (set.completed) {
        startRestTimer(splitData.exercises[exIdx].restSeconds || 120);
        snapSheet('half');
      }

      renderExercises();
    }

    function updateSetWeight(exIdx, sIdx, val) {
      splitData.exercises[exIdx].sets[sIdx].weight = parseFloat(val) || 0;
    }

    function updateSetReps(exIdx, sIdx, val) {
      splitData.exercises[exIdx].sets[sIdx].reps = parseInt(val, 10) || 0;
    }

    function addSet(exIdx) {
      const sets = splitData.exercises[exIdx].sets;
      const lastSet = sets[sets.length - 1] || { reps: 10, weight: 20 };
      sets.push({
        reps: lastSet.reps,
        weight: lastSet.weight,
        kind: 'working',
        completed: false
      });
      renderExercises();
    }

    function updateTopCounter() {
      document.getElementById('topCounter').innerText = `${totalCompletedSets} / ${totalPlannedSets}`;
    }

    // Workout Clock
    function startWorkoutClock() {
      if (workoutTimerInterval) clearInterval(workoutTimerInterval);
      workoutTimerInterval = setInterval(() => {
        const elapsedSec = Math.floor((Date.now() - workoutStartTime) / 1000);
        const mins = Math.floor(elapsedSec / 60);
        const secs = elapsedSec % 60;
        document.getElementById('totalElapsedDisplay').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // Rest Timer
    function startRestTimer(seconds) {
      restTimeRemaining = seconds;
      if (restTimerInterval) clearInterval(restTimerInterval);
      updateRestTimerDisplay();

      restTimerInterval = setInterval(() => {
        restTimeRemaining--;
        if (restTimeRemaining <= 0) {
          clearInterval(restTimerInterval);
          restTimeRemaining = 0;
          if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
        }
        updateRestTimerDisplay();
      }, 1000);
    }

    function updateRestTimerDisplay() {
      const mins = Math.floor(restTimeRemaining / 60);
      const secs = restTimeRemaining % 60;
      document.getElementById('restTimerDisplay').innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function adjustRestTimer(delta) {
      restTimeRemaining = Math.max(0, restTimeRemaining + delta);
      updateRestTimerDisplay();
      if (navigator.vibrate) navigator.vibrate(20);
    }

    function skipRestTimer() {
      restTimeRemaining = 0;
      if (restTimerInterval) clearInterval(restTimerInterval);
      updateRestTimerDisplay();
      if (navigator.vibrate) navigator.vibrate(20);
    }

    // Dragging & Snapping
    dragHandle.addEventListener('touchstart', (e) => {
      startY = e.touches[0].clientY;
      initialTop = sheet.getBoundingClientRect().top;
      isDragging = true;
      sheet.style.transition = 'none';
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      currentY = e.touches[0].clientY;
      const deltaY = currentY - startY;
      let newTop = initialTop + deltaY;
      const minTop = 52;
      const maxTop = window.innerHeight - 150;
      if (newTop < minTop) newTop = minTop;
      if (newTop > maxTop) newTop = maxTop;
      sheet.style.top = `${newTop}px`;
    }, { passive: true });

    window.addEventListener('touchend', () => {
      if (!isDragging) return;
      isDragging = false;
      sheet.style.transition = 'top 0.32s cubic-bezier(0.18, 0.89, 0.32, 1)';
      
      const currentTop = sheet.getBoundingClientRect().top;
      const windowHeight = window.innerHeight;

      if (currentTop < 190) {
        snapSheet('expanded');
      } else if (currentTop > windowHeight - 220) {
        snapSheet('collapsed');
      } else {
        snapSheet('half');
      }
    });

    function snapSheet(state) {
      sheetState = state;
      sheet.className = `sheet ${state}`;
      sheet.style.top = '';
    }

    // Finish Confirmation Dialog
    function promptFinishWorkout() {
      document.getElementById('confirmDialog').classList.add('open');
    }

    function closeConfirmDialog() {
      document.getElementById('confirmDialog').classList.remove('open');
    }

    function confirmFinishWorkout() {
      closeConfirmDialog();
      finishWorkout();
    }

    // Fullscreen Completion & Heatmap (Official Wger SVGs)
    function finishWorkout() {
      if (workoutTimerInterval) clearInterval(workoutTimerInterval);
      if (restTimerInterval) clearInterval(restTimerInterval);

      const elapsedSec = Math.floor((Date.now() - workoutStartTime) / 1000);
      const mins = Math.max(1, Math.floor(elapsedSec / 60));
      
      let totalVol = 0;
      splitData.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.completed) totalVol += (s.weight * s.reps);
        });
      });

      document.getElementById('compSetsHighlight').innerText = `${totalCompletedSets} sets`;
      document.getElementById('compVolumeHighlight').innerText = `${totalVol.toLocaleString()} ${splitData.weightUnit}`;
      document.getElementById('compTimeHighlight').innerText = `${mins} min`;
      document.getElementById('compPillSets').innerText = `${totalCompletedSets} sets`;
      
      renderAnatomyHeatmap();
      document.getElementById('completionScreen').classList.add('open');
    }

    function renderAnatomyHeatmap() {
      const frontEl = document.getElementById('frontMuscleLayers');
      const backEl = document.getElementById('backMuscleLayers');
      const root = "https://raw.githubusercontent.com/wger-project/wger/master/wger/core/static/images/muscles";

      const muscleIDs = [];
      const text = splitData.exercises.map(e => e.name.toLowerCase()).join(' ');

      if (text.includes('bench') || text.includes('chest') || text.includes('push') || text.includes('fly') || text.includes('dip')) {
        muscleIDs.push({ id: 4, isPrimary: true }); // Chest
        muscleIDs.push({ id: 2, isPrimary: false }); // Deltoids
        muscleIDs.push({ id: 5, isPrimary: false }); // Triceps
      }
      if (text.includes('bicep') || text.includes('curl')) {
        muscleIDs.push({ id: 1, isPrimary: true }); // Biceps
        muscleIDs.push({ id: 13, isPrimary: false }); // Forearms
      }
      if (text.includes('lat') || text.includes('pull') || text.includes('row') || text.includes('chin')) {
        muscleIDs.push({ id: 12, isPrimary: true }); // Lats
        muscleIDs.push({ id: 9, isPrimary: false }); // Traps
      }
      if (text.includes('squat') || text.includes('leg') || text.includes('quad') || text.includes('extension')) {
        muscleIDs.push({ id: 10, isPrimary: true }); // Quads
        muscleIDs.push({ id: 8, isPrimary: true }); // Glutes
        muscleIDs.push({ id: 7, isPrimary: false }); // Calves
      }
      if (text.includes('hamstring') || text.includes('deadlift') || text.includes('rdl')) {
        muscleIDs.push({ id: 11, isPrimary: true }); // Hamstrings
        muscleIDs.push({ id: 8, isPrimary: false }); // Glutes
      }
      if (text.includes('shoulder') || text.includes('overhead') || text.includes('lateral') || text.includes('raise')) {
        muscleIDs.push({ id: 2, isPrimary: true }); // Deltoids
        muscleIDs.push({ id: 5, isPrimary: false }); // Triceps
      }
      if (text.includes('abs') || text.includes('crunch') || text.includes('core')) {
        muscleIDs.push({ id: 6, isPrimary: true }); // Abs
        muscleIDs.push({ id: 14, isPrimary: false }); // Obliques
      }

      // Default fallback if no specific keywords matched
      if (muscleIDs.length === 0) {
        muscleIDs.push({ id: 4, isPrimary: true });
        muscleIDs.push({ id: 10, isPrimary: true });
        muscleIDs.push({ id: 12, isPrimary: true });
        muscleIDs.push({ id: 8, isPrimary: true });
      }

      const frontIDs = [1, 2, 3, 4, 6, 10, 13, 14];
      const backIDs = [5, 7, 8, 9, 11, 12, 15];

      let frontHtml = '';
      let backHtml = '';

      const seen = new Set();
      const uniqueMuscles = [];
      muscleIDs.forEach(m => {
        if (!seen.has(m.id)) {
          seen.add(m.id);
          uniqueMuscles.push(m);
        }
      });

      uniqueMuscles.forEach(m => {
        const folder = m.isPrimary ? 'main' : 'secondary';
        const roleClass = m.isPrimary ? 'primary' : 'secondary';
        const imgUrl = `${root}/${folder}/muscle-${m.id}.svg`;
        
        if (frontIDs.includes(m.id)) {
          frontHtml += `<img class="anatomy-layer ${roleClass}" src="${imgUrl}" alt="Muscle ${m.id}">`;
        }
        if (backIDs.includes(m.id)) {
          backHtml += `<img class="anatomy-layer ${roleClass}" src="${imgUrl}" alt="Muscle ${m.id}">`;
        }
      });

      frontEl.innerHTML = frontHtml;
      backEl.innerHTML = backHtml;
    }

    function buildWorkoutPlainText() {
      const dateStr = new Date().toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      const elapsedSec = Math.floor((Date.now() - workoutStartTime) / 1000);
      const mins = Math.max(1, Math.floor(elapsedSec / 60));
      
      let totalVol = 0;
      splitData.exercises.forEach(ex => {
        ex.sets.forEach(s => {
          if (s.completed) totalVol += (s.weight * s.reps);
        });
      });

      let text = `🏋️ ${splitData.name}\n`;
      text += `📅 ${dateStr} · ⏱ ${mins} min · ${totalCompletedSets} sets · ⚡ ${totalVol.toLocaleString()} ${splitData.weightUnit}\n\n`;

      splitData.exercises.forEach((ex, exIdx) => {
        const completedSets = ex.sets.filter(s => s.completed);
        const countStr = completedSets.length > 0 ? `${completedSets.length} sets` : `${ex.sets.length} sets`;
        text += `${exIdx + 1}. ${ex.name} (${countStr})\n`;
        
        ex.sets.forEach((s, sIdx) => {
          const checkMark = s.completed ? '✓' : '•';
          const warmupStr = s.kind === 'warmup' ? ' (Warmup 🔥)' : '';
          text += `   ${checkMark} Set ${sIdx + 1}: ${s.reps} reps @ ${s.weight} ${splitData.weightUnit}${warmupStr}\n`;
        });
        text += `\n`;
      });

      text += `Tracked with Rep ⚡\n`;
      return text;
    }

    async function exportWorkoutOnly() {
      const text = buildWorkoutPlainText();
      if (navigator.share) {
        try {
          await navigator.share({
            title: `${splitData.name} Workout`,
            text: text
          });
        } catch (err) {
          fallbackCopyText(text);
        }
      } else {
        fallbackCopyText(text);
      }
    }

    function fallbackCopyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        showToast('Workout Exported & Copied!');
      }).catch(() => {
        showToast('Export Ready');
      });
    }

    function redirectToBlankPage() {
      // Clear URL hash & params to prevent re-entering workout
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.pathname);
      }
      splitData = null;
      showBlankLandingPage();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2600);
    }

    initSplit();
  </script>
</body>
</html>
