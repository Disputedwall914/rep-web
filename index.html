<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rep Workout Split</title>
  <style>
    :root {
      --bg: #0d0d0f;
      --card-bg: #18181c;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f5f5f7;
      --text-muted: #8e8e93;
      --accent: #0a84ff;
      --accent-glow: rgba(10, 132, 255, 0.25);
      --success: #30d158;
      --tag-bg: rgba(255, 255, 255, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    /* Header & Branding */
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: var(--tag-bg);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .brand-badge span {
      color: var(--accent);
    }

    .header-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .split-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .split-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-pill {
      font-size: 13px;
      font-weight: 600;
      padding: 5px 10px;
      background: var(--tag-bg);
      border-radius: 8px;
      color: var(--text-muted);
    }

    .open-app-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #0a84ff, #5e5ce6);
      color: white;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      border-radius: 16px;
      margin-top: 18px;
      box-shadow: 0 4px 20px var(--accent-glow);
      transition: transform 0.1s ease;
    }

    .open-app-btn:active {
      transform: scale(0.98);
    }

    /* Exercises List */
    .section-title {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 24px 4px 12px;
    }

    .exercise-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
    }

    .exercise-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .exercise-name {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.3;
      flex: 1;
    }

    .rest-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background: var(--tag-bg);
      padding: 4px 8px;
      border-radius: 6px;
      margin-left: 8px;
      white-space: nowrap;
    }

    /* Sets */
    .sets-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .set-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .set-row.completed {
      background: rgba(48, 209, 88, 0.12);
      border: 1px solid rgba(48, 209, 88, 0.3);
    }

    .set-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .set-number {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      width: 20px;
    }

    .set-row.completed .set-number {
      color: var(--success);
    }

    .set-details {
      font-size: 15px;
      font-weight: 600;
    }

    .set-check {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .set-row.completed .set-check {
      background: var(--success);
      border-color: var(--success);
    }

    .set-check svg {
      display: none;
      width: 14px;
      height: 14px;
      stroke: white;
      stroke-width: 3;
      fill: none;
    }

    .set-row.completed .set-check svg {
      display: block;
    }

    /* Error / Empty State */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      background: var(--card-bg);
      border-radius: 24px;
      border: 1px solid var(--card-border);
    }

    .empty-state h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .empty-state p {
      font-size: 14px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container" id="app">
    <div class="brand-badge"><span>●</span> REP WORKOUT</div>
    
    <div id="content">
      <div class="empty-state">
        <h2>Loading Split...</h2>
        <p>Reading workout payload from link.</p>
      </div>
    </div>
  </div>

  <script>
    function getSplitDataFromUrl() {
      // Check URL hash or query params (?data= or #data=)
      let rawData = null;
      if (window.location.hash.includes('data=')) {
        rawData = window.location.hash.split('data=')[1];
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        rawData = urlParams.get('data');
      }

      if (!rawData) return null;

      try {
        // Base64URL to Base64
        let base64 = rawData.replace(/-/g, '+').replace(/_/g, '/');
        while (base64.length % 4) {
          base64 += '=';
        }
        const jsonStr = decodeURIComponent(escape(atob(base64)));
        return JSON.parse(jsonStr);
      } catch (err) {
        console.error('Failed to parse split data:', err);
        return null;
      }
    }

    function renderSplit() {
      const split = getSplitDataFromUrl();
      const contentEl = document.getElementById('content');

      if (!split) {
        contentEl.innerHTML = `
          <div class="empty-state">
            <h2>Invalid or Missing Split</h2>
            <p>Scan a Rep QR code or click a shared split link to view today's workout.</p>
          </div>
        `;
        return;
      }

      const splitName = split.n || split.name || 'Shared Workout';
      const weightUnit = split.u || split.weightUnit || 'kg';
      const exercises = split.e || split.exercises || [];
      const dataParam = window.location.hash.includes('data=') ? window.location.hash.split('data=')[1] : new URLSearchParams(window.location.search).get('data');
      const appDeepLink = `de.julian.rep://split/import?data=${dataParam}`;

      let exercisesHtml = '';
      exercises.forEach((ex, exIndex) => {
        const exName = ex.n || ex.name || 'Exercise';
        const restSec = ex.r || ex.restSeconds || 0;
        const sets = ex.t || ex.sets || [];

        let setsHtml = '';
        sets.forEach((set, sIndex) => {
          const reps = set.r || set.reps || 0;
          const weight = set.w !== undefined ? set.w : set.weight || 0;
          const setId = `set-${exIndex}-${sIndex}`;

          setsHtml += `
            <div class="set-row" onclick="toggleSet('${setId}')" id="${setId}">
              <div class="set-info">
                <span class="set-number">${sIndex + 1}</span>
                <span class="set-details">${reps} reps ${weight > 0 ? '· ' + weight + ' ' + weightUnit : ''}</span>
              </div>
              <div class="set-check">
                <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
              </div>
            </div>
          `;
        });

        exercisesHtml += `
          <div class="exercise-card">
            <div class="exercise-header">
              <span class="exercise-name">${exName}</span>
              ${restSec > 0 ? `<span class="rest-badge">${Math.floor(restSec / 60)}:${(restSec % 60).toString().padStart(2, '0')} rest</span>` : ''}
            </div>
            <div class="sets-list">
              ${setsHtml}
            </div>
          </div>
        `;
      });

      contentEl.innerHTML = `
        <div class="header-card">
          <h1 class="split-title">${splitName}</h1>
          <div class="split-meta">
            <span class="meta-pill">${exercises.length} Exercises</span>
            <span class="meta-pill">${weightUnit.toUpperCase()}</span>
          </div>
          <a href="${appDeepLink}" class="open-app-btn">
            <span>Open in Rep App</span>
          </a>
        </div>

        <div class="section-title">Today's Exercises</div>
        ${exercisesHtml}
      `;
    }

    function toggleSet(id) {
      const el = document.getElementById(id);
      if (el) {
        el.classList.toggle('completed');
      }
    }

    renderSplit();
  </script>
</body>
</html>
